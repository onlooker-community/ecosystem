name: Release Please
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

# Nothing is published to npm from here. The root package has no entry point
# (no main/exports/types), and its only declared surface was a `bin` pointing at
# an install.sh that copied from rules/ and .cursor/ — directories that never
# existed in this repo. Plugins ship through the Claude Code marketplace, which
# reads this repository over git, so npm was never on the install path. The
# published package is deprecated on the registry; see ecosystem-enz.
#
# The guard against this coming back is the absence of a publish step here.
# package.json also carries "private": true, npm's documented marker for a
# package that must not be published — but treat that as intent, not as a
# verified backstop: `npm publish --dry-run` does not exercise the check, and
# the authenticated path errors on auth before reaching it, so neither could be
# confirmed locally.

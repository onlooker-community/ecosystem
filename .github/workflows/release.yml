name: Release Please
on:
  push:
    branches:
      - main

# release-please writes through the app token below, not GITHUB_TOKEN, so the
# workflow's own token needs nothing beyond read.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A pull request opened with GITHUB_TOKEN does not start workflows on its
      # own: GitHub holds them for a human to approve, which is how it prevents
      # workflow loops. Every release PR's CI therefore waited for a manual
      # approval before auto-merge could act. A GitHub App's token is not
      # GITHUB_TOKEN, so the release PR it opens runs CI like any other PR, and
      # unlike a personal access token it neither expires nor makes every release
      # look authored by a person.
      #
      # GITHUB_TOKEN was chosen in #175 for npm trusted publishing
      # (id-token: write); #207 removed npm publishing, so that reason is gone.
      # The app needs Contents and Pull requests read/write on this repository.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

# Nothing is published to npm from here. The root package has no entry point
# (no main/exports/types), and its only declared surface was a `bin` pointing at
# an install.sh that copied from rules/ and .cursor/ — directories that never
# existed in this repo. Plugins ship through the Claude Code marketplace, which
# reads this repository over git, so npm was never on the install path. The
# published package is deprecated on the registry; see ecosystem-enz.
#
# The guard against this coming back is the absence of a publish step here.
# package.json also carries "private": true, npm's documented marker for a
# package that must not be published — but treat that as intent, not as a
# verified backstop: `npm publish --dry-run` does not exercise the check, and
# the authenticated path errors on auth before reaching it, so neither could be
# confirmed locally.

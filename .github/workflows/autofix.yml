name: Auto-format

# Applies `npm run lint` + `npm run format` automatically so formatting drift
# never has to be fixed by hand. On pull requests it pushes a fixup commit back
# to the PR branch with the onlooker-release-bot app token, which re-triggers
# checks — this is what keeps the release-please PR green without manual
# intervention. On push to main it only checks: the app is not a bypass actor
# on main's rulesets, so drift that reaches main fails this run instead of
# being committed past review.
on:
  pull_request:
  push:
    branches:
      - main

# The fixup push uses the app token, so GITHUB_TOKEN only needs to read.
permissions:
  contents: read

jobs:
  autofix:
    name: Auto-format and lint
    runs-on: ubuntu-latest
    # On fork PRs the app's secrets are not available and we cannot push to the
    # contributor's branch, so skip the job rather than fail noisily. Same-repo
    # PRs (including release-please's) and pushes to main always run.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Push with the app token, not GITHUB_TOKEN: commits pushed with
      # GITHUB_TOKEN start no workflow runs, so the PR's required checks would
      # never run on the fixup commit. Same app and inputs as release.yml.
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: github.event_name == 'pull_request'
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          # Check out the actual branch head. For pull_request events the
          # default checkout is a detached merge ref we cannot push from.
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm ci

      - name: Apply lint and format fixes
        run: |
          npm run lint
          npm run format

      - name: Commit and push fixes
        # Branch names are author-controlled; read them from the environment,
        # never interpolated into the script, now that the job holds a write token.
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          if [ "$EVENT_NAME" = 'push' ]; then
            echo "::error::Formatting drift reached main. Run 'npm run lint && npm run format' and open a PR:"
            git diff --name-only
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: auto-format :art:'
          git push origin "HEAD:${HEAD_REF}"
